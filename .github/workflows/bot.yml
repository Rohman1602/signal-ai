name: Argon Pro Sniper Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          BACKUP_AI_API_KEY: ${{ secrets.BACKUP_AI_API_KEY }}
          BACKUP_AI_URL: ${{ secrets.BACKUP_AI_URL }}
          BACKUP_AI_MODEL: ${{ secrets.BACKUP_AI_MODEL }}
        run: python main.py

      - name: Save Bot Memory
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add config.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update state & stats" && git push)
