name: Argon 5m Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: argon-bot-runner
  cancel-in-progress: false

jobs:
  trading-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode
        uses: actions/checkout@v4

      - name: Jalankan AI Agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BACKUP_AI_API_KEY: ${{ secrets.BACKUP_AI_API_KEY }}
          BACKUP_AI_URL: ${{ secrets.BACKUP_AI_URL }}
          BACKUP_AI_MODEL: ${{ secrets.BACKUP_AI_MODEL }}
        run: |
          python3 -c "import requests" 2>/dev/null || pip install -q requests
          python3 main.py

      - name: Simpan Memori & Statistik
        run: |
          git config --local user.email "bot@argon.ai"
          git config --local user.name "Argon Remote"
          git add config.json
          git diff --quiet && git diff-staged --quiet || (git commit -m "Update state" && git push)
